set-option -g prefix F12
unbind C-b

bind -N "Reload Config" r \
     source-file ~/.config/tmux/tmux.conf \; \
     display-message "tmux config reloaded!"


bind -N "Split window..." s switch-client -T split-mode
bind -N "Split window vertically"   -T split-mode v split-window -v
bind -N "Split window horizontally" -T split-mode h split-window -h
unbind '"'
unbind %

# Overlay help window
unbind ?
bind -N "Show key bindings" ? display-popup -w 80% -h 80% "tmux list-keys -N | fzf"

# Styling and Theming
set -g @catppuccin_flavor 'mocha'
run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux
set-option -g status-style bg=default
set -g @catppuccin_status_bg "default"

# Status bar
set-option -g status-position top
set -g 'status-format[1]' ''
set -g status 2

set -g status-left ""
set -g status-right ""
# set -g status-right-length 100

set -g window-status-format "#[fg=#{@thm_blue},bg=default]#[reverse]#I#[noreverse]"
set -g window-status-current-format "#[fg=#{@thm_teal},bg=default]#[reverse]#W#[noreverse]"

# Miscelenious
set-option -g base-index 1

